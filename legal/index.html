        function taiyoMarkTrialSent() {

        function taiyoTrialAlreadySent() {
            try { return sessionStorage.getItem('taiyo_aw_trial') === '1'; } catch (e) { return false; }

            var called = false;

            gtag('event', 'conversion', {
                send_to: TRIAL_SEND_TO,
                event_callback: callback,
                event_timeout: 2000
            });
            setTimeout(callback, 2000);

        };
